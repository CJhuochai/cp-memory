name: Cross-platform validation

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install build
      - run: python scripts/test-package.py
      - run: python -m unittest discover -s tests -p test_cp_memory.py
      - run: python -X utf8 tests/personal_memory_benchmark.py
      - run: powershell -ExecutionPolicy Bypass -File .\scripts\test-install.ps1
  posix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.11'
            name: POSIX (macos-latest)
          - os: ubuntu-latest
            python: '3.11'
            name: POSIX (ubuntu-latest)
          - os: ubuntu-latest
            python: '3.10'
            name: POSIX (ubuntu-latest, Python 3.10)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install build
      - run: python scripts/test-package.py
      - run: python -m unittest discover -s tests -p test_cp_memory.py
      - run: python -X utf8 tests/personal_memory_benchmark.py
      - run: sh scripts/test-install.sh
